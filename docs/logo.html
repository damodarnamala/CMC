<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMC Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: radial-gradient(ellipse at center, #14110b 0%, #08090d 60%, #050608 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .lockup {
        width: min(72vw, 760px);
        container-type: inline-size; /* lets the wordmark scale with the lockup */
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5em;
      }
      .mark {
        width: 100%;
        height: auto;
        overflow: visible;
        filter: drop-shadow(0 0 18px rgba(251, 191, 36, 0.3));
      }
      .arc {
        width: 100%;
        height: auto;
        overflow: visible;
      }
      /* Matches the site's gold emboss subtitle (Cinzel, gold gradient, soft shadow) */
      .wordmark {
        margin: 0;
        font-family: "Cinzel", Georgia, serif;
        font-weight: 600;
        text-transform: uppercase;
        text-align: center;
        white-space: nowrap;
        font-size: 4cqi;
        line-height: 1;
        letter-spacing: 0.24em;
        padding-left: 0.24em; /* balances the trailing letter-spacing */
        background: linear-gradient(180deg, #fbf4d4 0%, #eed49e 30%, #d5b27f 55%, #bc9362 80%, #e2c382 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 10px rgba(251, 191, 36, 0.25));
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <!-- CMC monogram drawn as vector shapes (no image) -->
      <svg class="mark" viewBox="0 0 600 200" role="img" aria-label="CMC">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fbf4d4" />
            <stop offset="30%" stop-color="#eed49e" />
            <stop offset="55%" stop-color="#d5b27f" />
            <stop offset="80%" stop-color="#bc9362" />
            <stop offset="100%" stop-color="#8a5a12" />
          </linearGradient>
        </defs>
        <!-- left C -->
        <polygon fill="url(#gold)" points="10,50 170,50 200,80 170,110 10,110 42,80" />
        <!-- right C (mirror) -->
        <polygon fill="url(#gold)" points="590,50 430,50 400,80 430,110 590,110 558,80" />
        <!-- central M: zig-zag with two peaks and a V -->
        <polygon fill="url(#gold)" points="200,50 245,50 300,115 355,50 400,50 335,150 265,150" />
      </svg>

      <!-- gold arc under the mark -->
      <svg class="arc" viewBox="0 0 600 30" aria-hidden="true">
        <defs>
          <linearGradient id="arcGold" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#bc9362" stop-opacity="0" />
            <stop offset="50%" stop-color="#fbf4d4" />
            <stop offset="100%" stop-color="#bc9362" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path d="M0,6 Q300,28 600,6" fill="none" stroke="url(#arcGold)" stroke-width="2" />
      </svg>

      <!-- real text, not an image -->
      <p class="wordmark">Creative Works</p>
    </div>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid & lens flares -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="200" cy="200" r="132" fill="none" stroke="#fbbf24" stroke-opacity="0.3"/>

  <!-- Cinema Aperture Blades (Abstract Director Icon) -->
  <g transform="translate(200, 160) scale(0.9)" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.35">
    <path d="M 0 -70 L 45 -25 L 30 40 L -30 40 L -45 -25 Z" />
    <circle cx="0" cy="0" r="48" stroke-dasharray="6 4"/>
  </g>

  <!-- Director Clapper / Film Camera Silhouette Motif -->
  <g transform="translate(160, 95) scale(0.7)" fill="url(#goldGrad)">
    <!-- Clapperboard top -->
    <path d="M0 10 L115 10 L105 28 L0 28 Z" opacity="0.9" />
    <!-- Stripes -->
    <path d="M15 10 L30 10 L20 28 L5 28 Z" fill="#0f172a" />
    <path d="M45 10 L60 10 L50 28 L35 28 Z" fill="#0f172a" />
    <path d="M75 10 L90 10 L80 28 L65 28 Z" fill="#0f172a" />
  </g>

  <!-- Monogram SS in Cinzel / Serif style -->
  <text x="200" y="225" 
        font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
        font-size="74" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        letter-spacing="4"
        filter="url(#glow)">SS</text>

  <!-- Title / Designation -->
  <text x="200" y="275" 
        font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="#fcd34d" 
        opacity="0.95">S. SREEVARDHAN</text>

  <text x="200" y="300" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="3" 
        text-anchor="middle" 
        fill="#94a3b8">WRITER &amp; DIRECTOR</text>

  <text x="200" y="325" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="10" 
        font-weight="500" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#f59e0b"
        opacity="0.8">IIT KRISHNAMURTHY</text>

  <!-- Outer Frame -->
  <rect x="12" y="12" width="376" height="376" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
